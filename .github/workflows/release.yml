name: Release

# Started by hand (Actions > Release > Run workflow) after the "chore(release): x.y.z"
# commit is on main. Tags that commit, builds the files and publishes the GitHub release
# that `--update` reads: onmyplate.py, wheel, source archive and SHA256SUMS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Read the version
        id: version
        run: |
          version=$(python -c 'import onmyplate; print(onmyplate.VERSION)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged. Bump VERSION, pyproject.toml and CHANGELOG.md first."
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no $version section"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install build==1.3.0
          python -m build
          cp onmyplate.py dist/
          cd dist
          test -f "onmyplate-$VERSION-py3-none-any.whl" && test -f "onmyplate-$VERSION.tar.gz"
          sha256sum "onmyplate-$VERSION-py3-none-any.whl" "onmyplate-$VERSION.tar.gz" onmyplate.py > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0)
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          {
            echo
            echo '### Updating'
            echo '```sh'
            echo 'onmyplate --update          # or: python3 onmyplate.py --update'
            echo '```'
            echo
            echo '**Files:** `onmyplate.py` is the whole tool; the wheel and source archive are for pip/pipx. Verify downloads with `shasum -a 256 -c SHA256SUMS`.'
            echo
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
          } >> notes.md
          cat notes.md
      - name: Tag and publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "On My Plate $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "On My Plate $VERSION" \
            --notes-file notes.md dist/onmyplate-*.whl dist/onmyplate-*.tar.gz \
            dist/onmyplate.py dist/SHA256SUMS
